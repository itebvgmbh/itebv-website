kind = "web"
previewPath = "/"
title = "ITEBV Website"
version = "1.0.0"
id = "artifacts/itebv-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25134

[services.development]
run = "pnpm --filter @workspace/itebv-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itebv-website", "run", "build" ]
publicDir = "artifacts/itebv-website/dist/public"
serve = "static"

# Rewrites fuer die prerenderten Seiten (scripts/prerender.mjs schreibt sie nach
# dist/public/seiten/<pfad>.html und bricht den Build ab, wenn hier eine Regel fehlt).
# Gesicherte Semantik (Replit-Doku "Static Deployment Configuration" + empirisch):
#  - ERSTER Treffer gewinnt; kein Fallthrough.
#  - "*" nur als eigenes letztes Segment ("/pfad/*"); "/pfad/*" matcht auch das nackte "/pfad".
#  - "to" muss eine konstante, existierende Datei sein.
#  - Echte Dateien (Assets, sitemap.xml) gewinnen immer via Shadowing.
#  - Gibt es unter dist/public einen ORDNER namens /pfad, leitet der Server /pfad per
#    301 auf /pfad/ um, bevor eine Regel greift. Darum liegen die Seiten unter /seiten/.
# KEIN Catch-all "/*": unbekannte Adressen bekommen dist/public/404.html mit Status 404.
# Reihenfolge: Blog-Slugs VOR /blog/*.
# NEUER BLOG-BEITRAG => neuen Block im Slug-Abschnitt ergaenzen.

# --- Blog-Einzelbeitraege ---
[[services.production.rewrites]]
from = "/blog/ki-kompass-august-2026/*"
to = "/seiten/blog/ki-kompass-august-2026.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-juli-2026/*"
to = "/seiten/blog/ki-kompass-juli-2026.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-juni-2026/*"
to = "/seiten/blog/ki-kompass-juni-2026.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-mai-2026/*"
to = "/seiten/blog/ki-kompass-mai-2026.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-april-2026/*"
to = "/seiten/blog/ki-kompass-april-2026.html"

# --- Blog-Uebersicht (NACH den Slugs; faengt auch unbekannte /blog/xyz ab) ---
[[services.production.rewrites]]
from = "/blog/*"
to = "/seiten/blog.html"

# --- Statische Top-Level-Seiten ---
[[services.production.rewrites]]
from = "/analyse/*"
to = "/seiten/analyse.html"

[[services.production.rewrites]]
from = "/software/*"
to = "/seiten/software.html"

[[services.production.rewrites]]
from = "/ki-loesungen/*"
to = "/seiten/ki-loesungen.html"

[[services.production.rewrites]]
from = "/impressum/*"
to = "/seiten/impressum.html"

[[services.production.rewrites]]
from = "/datenschutz/*"
to = "/seiten/datenschutz.html"

# "/" braucht keine Regel: /index.html ist eine echte Datei -> Shadowing.

[services.env]
PORT = "25134"
BASE_PATH = "/"
