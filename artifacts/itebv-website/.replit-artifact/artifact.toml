kind = "web"
previewPath = "/"
title = "ITEBV Website"
version = "1.0.0"
id = "artifacts/itebv-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25134

[services.development]
run = "pnpm --filter @workspace/itebv-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itebv-website", "run", "build" ]
publicDir = "artifacts/itebv-website/dist/public"
serve = "static"

# Prerenderte Per-Route-HTML ausliefern. Replit loest extensionslose Pfade NICHT
# automatisch zu /<route>/index.html auf -> pro Route eine Regel mit Wildcard am
# ENDE von "from" (gueltige Syntax) und konstantem "to" (gleiches Muster wie der
# funktionierende /*-Fallback). Reihenfolge = Prioritaet, erster Treffer gewinnt;
# echte Dateien werden via Shadowing ohnehin zuerst bedient. /* steht zuletzt.

# --- Statische Top-Level-Seiten ---
[[services.production.rewrites]]
from = "/analyse*"
to = "/analyse/index.html"

[[services.production.rewrites]]
from = "/software*"
to = "/software/index.html"

[[services.production.rewrites]]
from = "/ki-loesungen*"
to = "/ki-loesungen/index.html"

[[services.production.rewrites]]
from = "/impressum*"
to = "/impressum/index.html"

[[services.production.rewrites]]
from = "/datenschutz*"
to = "/datenschutz/index.html"

# --- Blog-Beitraege (MUESSEN vor der /blog-Indexregel stehen) ---
# Neuer Beitrag = neue Zeile nach diesem Muster ergaenzen.
[[services.production.rewrites]]
from = "/blog/ki-kompass-juni-2026*"
to = "/blog/ki-kompass-juni-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-mai-2026*"
to = "/blog/ki-kompass-mai-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-april-2026*"
to = "/blog/ki-kompass-april-2026/index.html"

# --- Blog-Uebersicht ---
[[services.production.rewrites]]
from = "/blog*"
to = "/blog/index.html"

# --- SPA-Fallback fuer alle nicht prerenderten Pfade ---
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25134"
BASE_PATH = "/"
