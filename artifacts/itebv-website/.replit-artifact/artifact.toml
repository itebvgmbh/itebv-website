kind = "web"
previewPath = "/"
title = "ITEBV Website"
version = "1.0.0"
id = "artifacts/itebv-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25134

[services.development]
run = "pnpm --filter @workspace/itebv-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itebv-website", "run", "build" ]
publicDir = "artifacts/itebv-website/dist/public"
serve = "static"

# Prerenderte Per-Route-HTML ausliefern.
# WICHTIG: Replit wertet Rewrites als "LETZTER Treffer gewinnt" aus (empirisch
# bestaetigt). Daher steht der /*-Fallback ZUERST und die spezifischeren Regeln
# DARUNTER (in steigender Spezifitaet), damit fuer jede URL die passende Regel
# der letzte Treffer ist. Echte Dateien (Assets, /sitemap.xml, /<route>/index.html)
# werden via Shadowing ohnehin direkt bedient. "*" nur am Ende, "to" ist konstant.

# Fallback fuer alle nicht prerenderten Pfade (zuerst -> wird unten ueberschrieben).
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

# Statische Top-Level-Seiten.
[[services.production.rewrites]]
from = "/analyse*"
to = "/analyse/index.html"

[[services.production.rewrites]]
from = "/software*"
to = "/software/index.html"

[[services.production.rewrites]]
from = "/ki-loesungen*"
to = "/ki-loesungen/index.html"

[[services.production.rewrites]]
from = "/impressum*"
to = "/impressum/index.html"

[[services.production.rewrites]]
from = "/datenschutz*"
to = "/datenschutz/index.html"

# Blog-Uebersicht (vor den Einzelbeitraegen, damit /blog/<slug> spaeter gewinnt).
[[services.production.rewrites]]
from = "/blog*"
to = "/blog/index.html"

# Blog-Beitraege (MUESSEN nach /blog* stehen). Neuer Beitrag = neue Zeile.
[[services.production.rewrites]]
from = "/blog/ki-kompass-juni-2026*"
to = "/blog/ki-kompass-juni-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-mai-2026*"
to = "/blog/ki-kompass-mai-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-april-2026*"
to = "/blog/ki-kompass-april-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-juli-2026*"
to = "/blog/ki-kompass-juli-2026/index.html"

[[services.production.rewrites]]
from = "/blog/ki-kompass-august-2026*"
to = "/blog/ki-kompass-august-2026/index.html"

[services.env]
PORT = "25134"
BASE_PATH = "/"
