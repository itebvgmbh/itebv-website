kind = "web"
previewPath = "/"
title = "ITEBV Website"
version = "1.0.0"
id = "artifacts/itebv-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25134

[services.development]
run = "pnpm --filter @workspace/itebv-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itebv-website", "run", "build" ]
publicDir = "artifacts/itebv-website/dist/public"
serve = "static"

# Prerenderte Per-Route-HTML zuerst ausliefern (Replit löst extensionlose Pfade
# NICHT automatisch zu /<route>/index.html auf). Reihenfolge = Priorität; existiert
# die Zieldatei nicht, greift am Ende der SPA-Fallback.

# Blog-Beiträge: ein Wildcard deckt alle aktuellen UND künftigen Posts ab.
[[services.production.rewrites]]
from = "/blog/*"
to = "/blog/*/index.html"

# Statische Top-Level-Seiten (clean URL -> Verzeichnis-Index).
[[services.production.rewrites]]
from = "/analyse"
to = "/analyse/index.html"

[[services.production.rewrites]]
from = "/software"
to = "/software/index.html"

[[services.production.rewrites]]
from = "/ki-loesungen"
to = "/ki-loesungen/index.html"

[[services.production.rewrites]]
from = "/blog"
to = "/blog/index.html"

[[services.production.rewrites]]
from = "/impressum"
to = "/impressum/index.html"

[[services.production.rewrites]]
from = "/datenschutz"
to = "/datenschutz/index.html"

# SPA-Fallback für alle nicht prerenderten Pfade.
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25134"
BASE_PATH = "/"
